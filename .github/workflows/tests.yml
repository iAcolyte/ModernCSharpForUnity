name: Tests

on:
  push:
  pull_request:

jobs:
  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test the polyfill generator and the C# feature matrix
        run: dotnet test "Source~/ModernCSharp.sln" --logger "console;verbosity=normal"
